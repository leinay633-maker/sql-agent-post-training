name: Exec Feedback Agent acceptance
on:
  workflow_dispatch:
    inputs:
      require_ml:
        description: Install and require offline Transformers/PEFT integration
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,server]'
      - name: Install ML integration dependencies
        if: ${{ inputs.require_ml }}
        run: python -m pip install -e '.[ml]'
      - name: Verify implementation
        env:
          REQUIRE_ML: ${{ inputs.require_ml }}
        run: |
          EXTRA=''
          if [[ "$REQUIRE_ML" == 'true' ]]; then EXTRA='--require-ml'; fi
          python scripts/verify.py --out outputs/acceptance $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: outputs/acceptance
