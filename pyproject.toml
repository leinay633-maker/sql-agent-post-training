[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exec-feedback-agent"
version = "0.3.0"
description = "Execution-feedback SQL agent: isolated evaluation and response-only QLoRA research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]
server = ["fastapi==0.128.2", "uvicorn==0.48.0"]
ml = ["torch==2.10.0", "transformers==4.57.3", "peft==0.18.0", "accelerate==1.12.0", "huggingface-hub==0.36.0", "tokenizers==0.22.2", "safetensors==0.7.0"]
gpu = ["bitsandbytes==0.48.2"]

[project.scripts]
efa = "exec_feedback.manage:main"

[tool.setuptools.packages.find]
include = ["exec_feedback*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
exec_feedback = ["web/*.html"]
