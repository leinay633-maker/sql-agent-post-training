<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>执行反馈数据分析 Agent</title>
<style>:root{font:16px/1.6 system-ui;color:#192a32;background:#f5f7f8}body{max-width:1120px;margin:40px auto;padding:0 24px}h1{font-size:28px}section{background:white;border:1px solid #d8e0e4;border-radius:10px;padding:24px;margin:18px 0}label{display:block;margin:12px 0 6px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #abbcc5;border-radius:5px}textarea,input{width:95%}button{cursor:pointer;background:#214b5b;color:white;margin:12px 8px 0 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf2f4;padding:14px}table{border-collapse:collapse;width:100%;display:block;overflow:auto}td,th{padding:8px;border-bottom:1px solid #d6e1e7;text-align:left}small{color:#536a75}.status{font-weight:600}details{border-top:1px solid #dde6ea;margin:12px 0;padding-top:12px}.error{color:#942d2d}</style></head><body>
<h1>执行反馈数据分析 Agent</h1><p>选择已接入的 SQLite 数据库，提交问题，查看查询结果和完整修正过程。</p>
<section><label>服务密钥（仅在服务端启用鉴权时填写，不保存到浏览器）</label><input id="key" type="password" autocomplete="off"><button id="connect">检查连接</button><p id="health" class="status">尚未连接</p><label>数据库</label><select id="database"></select><label>分析问题</label><textarea id="question" rows="4" placeholder="例如：按月份统计已支付订单的收入，按月份排序。"></textarea><label>口径补充（可留空）</label><textarea id="evidence" rows="2" placeholder="例如：收入不含已退款订单。"></textarea><button id="run">执行分析</button><small>只读查询；最多固定步数；不会修改数据库。</small></section>
<section id="answer" hidden><h2>结果</h2><p id="status"></p><pre id="sql"></pre><div id="table"></div><h3>执行轨迹</h3><div id="steps"></div><details><summary>原始记录</summary><pre id="raw"></pre></details><p><small>此页面没有参考答案，不将“SQL 执行成功”显示成“答案已验证正确”。研究对照请查看 study 输出的 report.html。</small></p></section>
<script>
const el=id=>document.getElementById(id);async function api(path,body){const headers={};if(el('key').value)headers.Authorization='Bearer '+el('key').value;if(body)headers['Content-Type']='application/json';const r=await fetch(path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.detail||data.error||r.status);return data}
el('connect').onclick=async()=>{try{const ready=await api('/readyz');const data=await api('/api/databases');el('health').textContent='已连接 · '+ready.model.model;el('health').className='status';el('database').replaceChildren(...data.databases.map(x=>{let option=document.createElement('option');option.value=x;option.textContent=x;return option}))}catch(e){el('health').textContent=e.message;el('health').className='error'}};
el('run').onclick=async()=>{el('run').disabled=true;el('health').textContent='正在执行查询…';try{const data=await api('/api/analyze',{database:el('database').value,question:el('question').value,evidence:el('evidence').value});el('answer').hidden=false;el('status').textContent='状态：'+data.status+' · 记录：'+data.run_id;el('sql').textContent=data.final_sql||'没有提交最终 SQL';el('raw').textContent=JSON.stringify(data,null,2);el('steps').replaceChildren(...data.steps.map((s,i)=>{const d=document.createElement('details'),t=document.createElement('summary'),p=document.createElement('pre');t.textContent='第 '+(i+1)+' 步 · '+(s.action?.action||'协议错误');p.textContent=JSON.stringify(s,null,2);d.append(t,p);return d}));el('table').replaceChildren();if(data.result?.status==='ok'){const table=document.createElement('table');const tr=document.createElement('tr');for(const c of data.result.columns){const th=document.createElement('th');th.textContent=c;tr.append(th)}table.append(tr);for(const row of data.result.rows){const tr=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=value===null?'NULL':typeof value==='object'?JSON.stringify(value):String(value);tr.append(td)}table.append(tr)}el('table').append(table);if(data.result.preview_truncated){const p=document.createElement('p');p.textContent='这里只显示结果预览；完整行数：'+data.result.row_count;el('table').append(p)}}el('health').textContent='本次执行结束'}catch(e){el('health').textContent=e.message;el('health').className='error'}finally{el('run').disabled=false}};
el('connect').click();
</script></body></html>
